<svg viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bg { fill: #07010f; }
      .scan {
        fill: none;
        stroke: #00f0ff;
        stroke-opacity: 0.05;
      }
      .glitch-text {
        font-family: 'Courier New', monospace;
        font-size: 54px;
        font-weight: 700;
        letter-spacing: 4px;
      }
      .layer-r { fill: #ff00c8; mix-blend-mode: screen; }
      .layer-g { fill: #faff00; mix-blend-mode: screen; }
      .layer-b { fill: #00f0ff; mix-blend-mode: screen; }
      .layer-main { fill: #f5faff; }
      .layer-r { animation: glitchR 1.6s infinite steps(1); }
      .layer-b { animation: glitchB 1.3s infinite steps(1); }
      .layer-g { animation: glitchG 1.9s infinite steps(1); }
      .noise-bar { animation: flicker 1.8s infinite; }
      .noise-bar2 { animation: flicker2 2.3s infinite; }
      .noise-bar3 { animation: flicker3 1.1s infinite; }
      @keyframes glitchR {
        0%, 70%, 100% { transform: translate(0, 0) skewX(0deg); opacity: 0.85; }
        71% { transform: translate(-18px, 3px) skewX(4deg); opacity: 1; }
        73% { transform: translate(12px, -6px) skewX(-3deg); opacity: 0.5; }
        75% { transform: translate(-8px, 0) skewX(0deg); opacity: 1; }
        77% { transform: translate(6px, 4px); opacity: 0.7; }
        80% { transform: translate(0,0); opacity: 0.9; }
        86% { transform: translate(-10px, -2px); opacity: 1; }
        88% { transform: translate(0,0); opacity: 0.85; }
      }
      @keyframes glitchB {
        0%, 65%, 100% { transform: translate(0, 0) skewX(0deg); opacity: 0.85; }
        66% { transform: translate(16px, -4px) skewX(-4deg); opacity: 1; }
        68% { transform: translate(-14px, 5px) skewX(3deg); opacity: 0.4; }
        70% { transform: translate(9px, 0); opacity: 1; }
        72% { transform: translate(-5px, -3px); opacity: 0.6; }
        76% { transform: translate(0,0); opacity: 0.9; }
        83% { transform: translate(11px, 2px); opacity: 1; }
        85% { transform: translate(0,0); opacity: 0.85; }
      }
      @keyframes glitchG {
        0%, 60%, 100% { transform: translate(0, 0) skewX(0deg); opacity: 0.8; }
        61% { transform: translate(10px, 6px) skewX(3deg); opacity: 1; }
        63% { transform: translate(-13px, -3px) skewX(-4deg); opacity: 0.5; }
        65% { transform: translate(7px, 1px); opacity: 1; }
        68% { transform: translate(-4px, -2px); opacity: 0.6; }
        74% { transform: translate(0,0); opacity: 0.9; }
        90% { transform: translate(-9px, 3px); opacity: 1; }
        92% { transform: translate(0,0); opacity: 0.8; }
      }
      @keyframes flicker {
        0%, 100% { opacity: 0; }
        40% { opacity: 0; }
        41% { opacity: 0.6; transform: translateY(0); }
        42% { opacity: 0; }
        43% { opacity: 0.5; transform: translateY(4px); }
        44% { opacity: 0; }
        70% { opacity: 0; }
        71% { opacity: 0.7; }
        73% { opacity: 0; }
      }
      @keyframes flicker2 {
        0%, 100% { opacity: 0; }
        20% { opacity: 0; }
        21% { opacity: 0.5; }
        23% { opacity: 0; }
        55% { opacity: 0; }
        56% { opacity: 0.6; transform: translateX(-20px); }
        58% { opacity: 0; }
        85% { opacity: 0; }
        86% { opacity: 0.4; }
        88% { opacity: 0; }
      }
      @keyframes flicker3 {
        0%, 100% { opacity: 0; }
        10% { opacity: 0; }
        11% { opacity: 0.8; }
        12% { opacity: 0; }
        50% { opacity: 0; }
        51% { opacity: 0.6; transform: translateX(15px); }
        53% { opacity: 0; }
      }
      .slot { animation-timing-function: steps(1); animation-iteration-count: infinite; animation-duration: 12s; }
      .slot1 { animation-name: cycle1; }
      .slot2 { animation-name: cycle2; }
      .slot3 { animation-name: cycle3; }
      .slot4 { animation-name: cycle4; }
      .slot5 { animation-name: cycle5; }
      .slot6 { animation-name: cycle6; }
      @keyframes cycle1 {
        0%, 16.6% { opacity: 1; }
        16.7%, 100% { opacity: 0; }
      }
      @keyframes cycle2 {
        0%, 16.6% { opacity: 0; }
        16.7%, 33.3% { opacity: 1; }
        33.4%, 100% { opacity: 0; }
      }
      @keyframes cycle3 {
        0%, 33.3% { opacity: 0; }
        33.4%, 50% { opacity: 1; }
        50.1%, 100% { opacity: 0; }
      }
      @keyframes cycle4 {
        0%, 50% { opacity: 0; }
        50.1%, 66.6% { opacity: 1; }
        66.7%, 100% { opacity: 0; }
      }
      @keyframes cycle5 {
        0%, 66.6% { opacity: 0; }
        66.7%, 83.3% { opacity: 1; }
        83.4%, 100% { opacity: 0; }
      }
      @keyframes cycle6 {
        0%, 83.3% { opacity: 0; }
        83.4%, 100% { opacity: 1; }
      }
    </style>
  </defs>
  <rect class="bg" width="1200" height="300"/>
  <!-- faint neon scanlines -->
  <g class="scan">
    <path d="M0,20 H1200" stroke-width="1"/>
    <path d="M0,60 H1200" stroke-width="1"/>
    <path d="M0,100 H1200" stroke-width="1"/>
    <path d="M0,140 H1200" stroke-width="1"/>
    <path d="M0,180 H1200" stroke-width="1"/>
    <path d="M0,220 H1200" stroke-width="1"/>
    <path d="M0,260 H1200" stroke-width="1"/>
  </g>
  <!-- random flicker noise bars -->
  <rect class="noise-bar" x="0" y="95" width="1200" height="10" fill="#00f0ff"/>
  <rect class="noise-bar2" x="0" y="190" width="1200" height="6" fill="#ff00c8" style="animation-delay:1.3s"/>
  <rect class="noise-bar3" x="0" y="55" width="1200" height="4" fill="#faff00"/>
  <rect class="noise-bar2" x="0" y="230" width="1200" height="14" fill="#00f0ff" style="animation-delay:0.6s"/>
  <rect class="noise-bar3" x="0" y="150" width="1200" height="3" fill="#ff00c8" style="animation-delay:0.4s"/>
  <!-- glitch layered text -->
  <g transform="translate(600,120)" text-anchor="middle">
    <text class="glitch-text layer-r">SAF THE CTHULHU</text>
    <text class="glitch-text layer-b">SAF THE CTHULHU</text>
    <text class="glitch-text layer-g">SAF THE CTHULHU</text>
    <text class="glitch-text layer-main">SAF THE CTHULHU</text>
  </g>
  <g transform="translate(600,175)" text-anchor="middle">
    <g class="slot slot1">
      <text class="glitch-text layer-r" font-size="22" letter-spacing="2">VISUAL ARTIST</text>
      <text class="glitch-text layer-b" font-size="22" letter-spacing="2">VISUAL ARTIST</text>
      <text class="glitch-text layer-main" font-size="22" letter-spacing="2" fill="#b967ff">VISUAL ARTIST</text>
    </g>
    <g class="slot slot2">
      <text class="glitch-text layer-r" font-size="19" letter-spacing="1.5">BLENDER · DREAMCORE / LIMINAL</text>
      <text class="glitch-text layer-b" font-size="19" letter-spacing="1.5">BLENDER · DREAMCORE / LIMINAL</text>
      <text class="glitch-text layer-main" font-size="19" letter-spacing="1.5" fill="#b967ff">BLENDER · DREAMCORE / LIMINAL</text>
    </g>
    <g class="slot slot3">
      <text class="glitch-text layer-r" font-size="18" letter-spacing="1">CP2077 / FRAGPUNK / THE FINALS</text>
      <text class="glitch-text layer-b" font-size="18" letter-spacing="1">CP2077 / FRAGPUNK / THE FINALS</text>
      <text class="glitch-text layer-main" font-size="18" letter-spacing="1" fill="#b967ff">CP2077 / FRAGPUNK / THE FINALS</text>
    </g>
    <g class="slot slot4">
      <text class="glitch-text layer-r" font-size="22" letter-spacing="2">CODER</text>
      <text class="glitch-text layer-b" font-size="22" letter-spacing="2">CODER</text>
      <text class="glitch-text layer-main" font-size="22" letter-spacing="2" fill="#b967ff">CODER</text>
    </g>
    <g class="slot slot5">
      <text class="glitch-text layer-r" font-size="18" letter-spacing="1.2">MUSIC PRODUCER · FL STUDIO</text>
      <text class="glitch-text layer-b" font-size="18" letter-spacing="1.2">MUSIC PRODUCER · FL STUDIO</text>
      <text class="glitch-text layer-main" font-size="18" letter-spacing="1.2" fill="#b967ff">MUSIC PRODUCER · FL STUDIO</text>
    </g>
    <g class="slot slot6">
      <text class="glitch-text layer-r" font-size="20" letter-spacing="1.5">CP2077 MODDER</text>
      <text class="glitch-text layer-b" font-size="20" letter-spacing="1.5">CP2077 MODDER</text>
      <text class="glitch-text layer-main" font-size="20" letter-spacing="1.5" fill="#b967ff">CP2077 MODDER</text>
    </g>
  </g>
</svg>
